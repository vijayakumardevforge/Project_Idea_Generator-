spring.application.name=Project Idea Generator
server.port=8080

# Import local secrets (ignored by Git)
spring.config.import=optional:file:./application-secrets.properties

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aiprojects}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# AI Provider Configuration (Groq - Free, Fast, No Credits Needed)
huggingface.api.url=${AI_API_URL:https://api.groq.com/openai/v1/chat/completions}
huggingface.api.token.idea=${GROQ_API_KEY:${HUGGINGFACE_API_TOKEN_IDEA:}}
huggingface.api.token.roadmap=${GROQ_API_KEY:${HUGGINGFACE_API_TOKEN_ROADMAP:}}


# Redis Configuration
spring.data.redis.url=${REDIS_URL}

# Admin Configuration
admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD:admin_password_here}
